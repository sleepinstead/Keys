# Builds Keys for Windows (an unsigned NSIS installer) and runs the core's tests on Windows.
# Started by `npm run release` in keys-windows (or by hand). The update signature is added afterwards on the
# Mac, so the update key never leaves it.
name: windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: keys-windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: keys-windows/desktop
      - run: npm ci
        working-directory: keys-windows
      - run: npm run build
        working-directory: keys-windows
      - name: Core tests
        working-directory: keys-windows/desktop
        run: cargo test -p keys-core
      - name: Build the installer
        working-directory: keys-windows/desktop/app
        shell: bash
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: keys-windows
          path: keys-windows/desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
