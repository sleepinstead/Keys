[package]
name = "keys-core"
version = "0.1.0"
edition = "2024"
description = "Keys: the vault, its encryption and the local API, in Rust"
publish = false

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
zxcvbn = "3"
rust-embed = "8"
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
