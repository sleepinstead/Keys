[package]
name = "keys-app"
version = "0.2.5"
edition = "2024"
description = "Keys for Mac"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keys-core = { path = "../core" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "time"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
serde_json = "1"
