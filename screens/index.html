<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keys Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --page: #f4f4f5;
    --panel: #ffffff;
    --ink: #0a0a0a;
    --ink-2: #52525b;
    --ink-3: #71717a;
    --line: #e4e4e7;
    --chip: #f4f4f5;
    --chip-on: #0a0a0a;
    --chip-on-ink: #ffffff;
    --check-a: #e4e4e7;
    --check-b: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-ui='light']) {
      --page: #0b0b0c;
      --panel: #151517;
      --ink: #f4f4f5;
      --ink-2: #a1a1aa;
      --ink-3: #8b8b94;
      --line: #26262a;
      --chip: #1d1d20;
      --chip-on: #f4f4f5;
      --chip-on-ink: #0a0a0a;
      --check-a: #232326;
      --check-b: #18181b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 14px 32px;
    background: color-mix(in srgb, var(--page) 86%, transparent);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 600; font-size: 15px; margin-right: auto; display: flex; gap: 8px; align-items: baseline; }
  .brand small { color: var(--ink-3); font-weight: 400; font-size: 13px; }
  .opt { display: flex; align-items: center; gap: 8px; }
  .opt > span { color: var(--ink-2); font-size: 12.5px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--chip); border: 1px solid var(--line); }
  .seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
  .seg button[aria-pressed='true'] { background: var(--chip-on); color: var(--chip-on-ink); }
  .all { border: 1px solid var(--line); background: var(--panel); padding: 7px 13px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500; }
  .all:hover { border-color: var(--ink-3); }

  main { padding: 28px 32px 64px; max-width: 1600px; margin: 0 auto; }
  h2 { font-size: 13px; font-weight: 500; color: var(--ink-2); margin: 28px 0 14px; letter-spacing: 0.01em; display: flex; gap: 8px; }
  h2 b { color: var(--ink); font-weight: 600; }
  .grid { display: grid; gap: 22px; }
  .grid.app { grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }
  .grid.ext { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .stage {
    display: grid; place-items: center;
    padding: 22px;
    background: var(--frame, transparent);
  }
  .card[data-transparent] .stage {
    background-color: var(--check-b);
    background-image: conic-gradient(var(--check-a) 25%, transparent 0 50%, var(--check-a) 0 75%, transparent 0);
    background-size: 16px 16px;
  }
  .stage img { display: block; max-width: 100%; height: auto; border-radius: var(--r, 0); box-shadow: var(--shadow, none); }
  /* every extension screen is shown at the same height */
  .stage { overflow: hidden; }
  .grid.ext .stage img { width: 100%; max-width: 240px; height: auto; aspect-ratio: 368 / 600; }
  .meta { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .meta b { font-weight: 500; font-size: 13.5px; }
  .meta small { color: var(--ink-3); font-size: 12px; }
  .meta .dl { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
  .meta .dl:hover { border-color: var(--ink-3); }
  .meta .dl svg { width: 14px; height: 14px; }
  @media (max-width: 640px) { .bar, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Keys <small>every screen</small></div>
  <div class="opt"><span>Theme</span><div class="seg" data-opt="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
  <div class="opt"><span>Background</span><div class="seg" data-opt="bg"><button data-v="solid">Solid</button><button data-v="transparent">Transparent</button></div></div>
  <div class="opt"><span>Corners</span><div class="seg" data-opt="corners"><button data-v="rounded">Rounded</button><button data-v="sharp">Sharp</button></div></div>
  <button class="all" id="all">Download all</button>
</header>
<main id="main"></main>

<script src="shots.js"></script>
<script>
  const opts = { theme: 'light', bg: 'solid', corners: 'rounded' };
  try { Object.assign(opts, JSON.parse(localStorage.getItem('keys-screens') || '{}')); } catch {}

  // Export settings, in pixels of the 2x screenshot.
  const FRAME = { light: '#e9e9ec', dark: '#0f0f11' };
  const radiusFor = (group, w) => (opts.corners === 'sharp' ? 0 : group === 'ext' ? 24 : Math.round(w * 0.0125));
  const padFor = (w, h) => Math.round(Math.max(w, h) * 0.06);

  const DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>';
  const main = document.getElementById('main');

  function render() {
    document.querySelectorAll('.seg').forEach((seg) => seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(opts[seg.dataset.opt] === b.dataset.v))));
    main.replaceChildren();
    for (const [group, label] of [['app', 'Keys app'], ['ext', 'Browser extension']]) {
      const list = SHOTS.filter((s) => s.group === group && s.theme === opts.theme).sort((a, b) => a.order - b.order);
      const h = document.createElement('h2');
      h.innerHTML = `<b>${label}</b> ${list.length} screens`;
      const grid = document.createElement('div');
      grid.className = `grid ${group}`;
      for (const s of list) grid.append(card(s));
      main.append(h, grid);
    }
  }

  function card(s) {
    const el = document.createElement('article');
    el.className = 'card';
    if (opts.bg === 'transparent') el.dataset.transparent = '';
    const img = new Image();
    img.src = s.src;
    img.alt = s.title;
    img.onload = () => {
      // Preview radius is the export radius scaled to the displayed size.
      const r = radiusFor(s.group, img.naturalWidth) * (img.clientWidth / img.naturalWidth || 0.5);
      img.style.setProperty('--r', `${r}px`);
    };
    const stage = document.createElement('div');
    stage.className = 'stage';
    stage.style.setProperty('--frame', FRAME[opts.theme]);
    if (opts.bg === 'solid') img.style.setProperty('--shadow', '0 10px 30px -12px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.06)');
    stage.append(img);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<b></b><small></small><button class="dl" type="button">${DL}PNG</button>`;
    meta.querySelector('b').textContent = s.title;
    meta.querySelector('small').textContent = s.theme;
    meta.querySelector('.dl').onclick = () => download(s);
    el.append(stage, meta);
    return el;
  }

  function load(src) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  }

  async function exportPng(s) {
    const img = await load(s.src);
    const w = img.naturalWidth, h = img.naturalHeight;
    const pad = opts.bg === 'solid' ? padFor(w, h) : 0;
    const c = document.createElement('canvas');
    c.width = w + pad * 2;
    c.height = h + pad * 2;
    const g = c.getContext('2d');
    if (opts.bg === 'solid') { g.fillStyle = FRAME[opts.theme]; g.fillRect(0, 0, c.width, c.height); }
    const r = radiusFor(s.group, w);
    const path = new Path2D();
    path.roundRect(pad, pad, w, h, r);
    if (opts.bg === 'solid') {
      g.save();
      g.shadowColor = 'rgba(0,0,0,0.28)';
      g.shadowBlur = Math.round(w * 0.025);
      g.shadowOffsetY = Math.round(w * 0.008);
      g.fillStyle = FRAME[opts.theme];
      g.fill(path);
      g.restore();
    }
    g.save();
    g.clip(path);
    g.drawImage(img, pad, pad);
    g.restore();
    return new Promise((res) => c.toBlob(res, 'image/png'));
  }

  async function download(s) {
    const blob = await exportPng(s);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `keys-${s.group === 'ext' ? 'extension' : 'app'}-${s.key}-${s.theme}-${opts.corners}${opts.bg === 'transparent' ? '-transparent' : ''}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    opts[seg.dataset.opt] = b.dataset.v;
    try { localStorage.setItem('keys-screens', JSON.stringify(opts)); } catch {}
    if (seg.dataset.opt === 'theme') document.documentElement.dataset.ui = opts.theme;
    render();
  }));
  document.getElementById('all').onclick = async () => {
    for (const s of SHOTS.filter((x) => x.theme === opts.theme)) {
      await download(s);
      await new Promise((r) => setTimeout(r, 250));
    }
  };
  document.documentElement.dataset.ui = opts.theme;
  render();
</script>
</body>
</html>
